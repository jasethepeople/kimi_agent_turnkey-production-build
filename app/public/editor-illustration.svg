<svg width="600" height="450" viewBox="0 0 600 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- outer frame, split panes -->
    <rect x="60" y="70" width="480" height="310" rx="14" stroke="#8B7CFF" stroke-width="3"/>
    <path d="M300 70 V 380" stroke="#8B7CFF" stroke-width="2" opacity="0.6"/>
    <!-- left pane: manuscript lines -->
    <g stroke="#8B7CFF" stroke-width="2.5">
      <path d="M95 120 H 265" opacity="0.9"/>
      <path d="M95 155 H 250" opacity="0.7"/>
      <path d="M95 190 H 265" opacity="0.6"/>
      <path d="M95 225 H 235" opacity="0.5"/>
      <path d="M95 260 H 260" opacity="0.4"/>
      <path d="M95 295 H 245" opacity="0.35"/>
    </g>
    <!-- a highlighted line being rewritten -->
    <path d="M95 330 H 265" stroke="#E8A15C" stroke-width="3"/>
    <rect x="88" y="318" width="186" height="26" rx="6" stroke="#E8A15C" stroke-width="1.5" opacity="0.6"/>
    <!-- right pane: style weight slider -->
    <path d="M340 200 H 500" stroke="#8B7CFF" stroke-width="3"/>
    <circle cx="415" cy="200" r="12" stroke="#E8A15C" stroke-width="3"/>
    <g stroke="#8B7CFF" stroke-width="2" opacity="0.7">
      <path d="M340 182 V 172"/>
      <path d="M380 182 V 172"/>
      <path d="M420 182 V 172"/>
      <path d="M460 182 V 172"/>
      <path d="M500 182 V 172"/>
    </g>
    <path d="M330 160 H 375" stroke="#E8A15C" stroke-width="2" opacity="0.8"/>
    <path d="M465 160 H 510" stroke="#E8A15C" stroke-width="2" opacity="0.8"/>
    <!-- control glyphs: dials -->
    <circle cx="380" cy="290" r="22" stroke="#8B7CFF" stroke-width="2.5"/>
    <path d="M380 290 L 392 276" stroke="#E8A15C" stroke-width="2.5"/>
    <circle cx="465" cy="290" r="22" stroke="#8B7CFF" stroke-width="2.5" opacity="0.7"/>
    <path d="M465 290 L 455 274" stroke="#E8A15C" stroke-width="2.5" opacity="0.8"/>
    <!-- toggle -->
    <rect x="370" y="330" width="56" height="24" rx="12" stroke="#8B7CFF" stroke-width="2.5"/>
    <circle cx="412" cy="342" r="8" fill="#E8A15C"/>
    <!-- annotations -->
    <path d="M95 95 c 20 -14, 60 -14, 80 0" stroke="#E8A15C" stroke-width="2" opacity="0.7"/>
    <circle cx="500" cy="120" r="2.5" fill="#8B7CFF"/>
    <circle cx="340" cy="120" r="2" fill="#E8A15C" opacity="0.7"/>
  </g>
</svg>
