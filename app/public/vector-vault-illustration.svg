<svg width="600" height="450" viewBox="0 0 600 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- cursive handwriting strokes decomposing into bezier curves -->
    <path d="M40 120 C 90 60, 130 160, 170 100 C 200 55, 230 140, 260 95" stroke="#8B7CFF" stroke-width="3" fill="none"/>
    <path d="M55 170 C 100 130, 150 210, 195 165 C 225 135, 245 195, 270 160" stroke="#8B7CFF" stroke-width="2.5" fill="none" opacity="0.7"/>
    <path d="M70 220 C 115 185, 160 255, 205 215" stroke="#8B7CFF" stroke-width="2" fill="none" opacity="0.5"/>
    <!-- bezier control skeleton -->
    <path d="M260 95 L 310 130 L 350 110" stroke="#E8A15C" stroke-width="1.5" stroke-dasharray="4 6" fill="none" opacity="0.8"/>
    <path d="M270 160 L 320 190 L 360 170" stroke="#E8A15C" stroke-width="1.5" stroke-dasharray="4 6" fill="none" opacity="0.6"/>
    <circle cx="260" cy="95" r="4" fill="#E8A15C"/>
    <circle cx="310" cy="130" r="4" fill="none" stroke="#E8A15C" stroke-width="1.5"/>
    <circle cx="350" cy="110" r="4" fill="#E8A15C"/>
    <circle cx="270" cy="160" r="3.5" fill="#E8A15C" opacity="0.8"/>
    <circle cx="360" cy="170" r="3.5" fill="none" stroke="#E8A15C" stroke-width="1.5"/>
    <!-- flow lines into the vault -->
    <path d="M300 240 C 360 230, 400 260, 440 290" stroke="#8B7CFF" stroke-width="2" fill="none" opacity="0.6"/>
    <path d="M290 280 C 350 280, 390 300, 430 320" stroke="#8B7CFF" stroke-width="2" fill="none" opacity="0.4"/>
    <path d="M310 200 C 370 190, 410 220, 450 250" stroke="#E8A15C" stroke-width="1.5" fill="none" opacity="0.5"/>
    <!-- vault / lock -->
    <rect x="420" y="270" width="140" height="110" rx="16" stroke="#8B7CFF" stroke-width="3" fill="none"/>
    <path d="M455 270 v-30 a35 35 0 0 1 70 0 v30" stroke="#8B7CFF" stroke-width="3" fill="none"/>
    <circle cx="490" cy="318" r="12" stroke="#E8A15C" stroke-width="3" fill="none"/>
    <path d="M490 330 v16" stroke="#E8A15C" stroke-width="3"/>
    <!-- glow dots -->
    <circle cx="430" cy="250" r="2.5" fill="#8B7CFF"/>
    <circle cx="400" cy="300" r="2" fill="#8B7CFF" opacity="0.7"/>
    <circle cx="380" cy="340" r="2" fill="#E8A15C" opacity="0.7"/>
    <!-- scattered particles -->
    <circle cx="120" cy="300" r="2" fill="#8B7CFF" opacity="0.5"/>
    <circle cx="180" cy="330" r="1.8" fill="#8B7CFF" opacity="0.4"/>
    <circle cx="90" cy="270" r="1.5" fill="#E8A15C" opacity="0.5"/>
  </g>
</svg>
